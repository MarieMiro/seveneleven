{% extends 'layout/basic.html' %}
{% load django_bootstrap5 %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<h2>Смена пароля пользователя {{ user.username }}</h2>
<form method="post">
    {% bootstrap_button 'Сменить пароль' %}
    {% csrf_token %}
    {% bootstrap_form form layout='horizontal' %}
</form>
{% endblock %}
